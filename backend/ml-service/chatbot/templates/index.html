<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A.R.T.H.I. - AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>S.A.R.T.H.I.</h1>
            <p>Station AI Routing Transit &amp; Helpful Information</p>
        </div>

        <!-- Chat Window -->
        <div class="chat" id="chatWindow">
            <div class="message bot">
                Hello! I am S.A.R.T.H.I., your railway station assistant.<br>
                Ask me about routes, platforms, luggage rules, or facilities.
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your question..." autofocus>
            <button class="btn btn-microphone" id="micBtn" title="Voice input">🎤</button>
            <button class="btn btn-send" id="sendBtn" title="Send">➤</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
